<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matrics Corporation — The Nervous System for Indian Commerce</title>
    <meta name="description" content="Unified transaction layer and logistics nervous system connecting manufacturers, distributors, kirana stores, and financial partners across Bharat." />
    <meta property="og:title" content="Matrics Corporation — The Nervous System for Indian Commerce" />
    <meta property="og:description" content="Unified transaction layer and logistics nervous system connecting manufacturers, distributors, kirana stores, and financial partners across Bharat." />
    <!-- Start downloading the globe's texture and lighting while the page code loads. -->
    <link rel="preload" href="/textures/earth_atmos_2048.jpg" as="image" crossorigin="anonymous" fetchpriority="low" />
    <link rel="preload" href="/hdri/studio_small_03_1k.hdr" as="fetch" crossorigin="anonymous" fetchpriority="low" />
    <script>
      // First visit: fetch the floating intro logo early
      // (the reveal itself is in components/IntroReveal.tsx; ?intro replays it).
      try {
        var replay = /[?&]intro(=|&|$)/.test(location.search);
        var calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (replay || (!calm && !localStorage.getItem('matrics-intro-seen'))) {
          document.documentElement.classList.add('intro-pending', 'intro-hold');
          var link = document.createElement('link');
          link.rel = 'preload'; link.as = 'image'; link.href = '/brand/matrics-grid.webp';
          link.setAttribute('fetchpriority', 'high');
          document.head.appendChild(link);
        }
      } catch (e) {}
    </script>
    <style>
      /* The page scrolls (it used to be locked by overflow:hidden, so the mouse
         wheel and touch could not move it). Sideways overflow stays clipped and
         the page scrollbar stays hidden, as before. */
      html {
        scrollbar-width: none;
      }
      html::-webkit-scrollbar {
        display: none;
      }
      body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        background: radial-gradient(circle at 48% 44%, #ffa63d 0%, #f6720e 32%, #e05303 68%, #b83a00 100%);
        background-color: #f6720e;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      canvas {
        display: block;
      }
      #root {
        width: 100vw;
        height: 100vh;
      }
      ::selection {
        background: rgba(255, 255, 255, 0.3);
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
